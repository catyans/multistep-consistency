name: CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  records-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install 'numpy>=1.24,<2' 'scipy>=1.10,<1.16' matplotlib
      - run: python verify_records.py
      - run: python -m unittest discover -s tests -v
      - run: python plot_records.py --input-dir records --output outputs/cross_model_step_sweep.png
